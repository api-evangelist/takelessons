name: TakeLessons
description: >-
  TakeLessons was an online and in-person lessons marketplace founded in 2007 by
  Steven Cox and headquartered in San Diego, California. It connected students
  with independent instructors for music, languages, academic subjects, cooking,
  and professional training, handling scheduling, payments, and instructor
  discovery. Microsoft acquired TakeLessons in September 2021 to expand its
  edtech offerings, then wound the service down: the last day to book lessons was
  August 15, 2024 and the consumer site closed on November 15, 2024. The company
  is now defunct and publishes no live website, developer portal, or API surface;
  this record is retained as a portfolio-lineage stub for the API Evangelist
  network.
